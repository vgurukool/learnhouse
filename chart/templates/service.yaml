apiVersion: v1
kind: Service
metadata:
  name: {{ include "learnhouse.fullname" . }}
  labels:
    {{- include "learnhouse.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if .Values.service.collabPort }}
    - port: {{ .Values.service.collabPort }}
      targetPort: collab
      protocol: TCP
      name: collab
    {{- end }}
  selector:
    {{- include "learnhouse.selectorLabels" . | nindent 4 }}
