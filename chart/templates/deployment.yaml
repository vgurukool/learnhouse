apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "learnhouse.fullname" . }}
  labels:
    {{- include "learnhouse.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "learnhouse.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "learnhouse.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "learnhouse.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
            {{- if .Values.service.collabPort }}
            - name: collab
              containerPort: {{ .Values.service.targetCollabPort }}
              protocol: TCP
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "learnhouse.fullname" . }}-config
          {{- if .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          {{- end }}
          {{- if .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    sed -i 's/localhost:9000/127.0.0.1:9000/g; s/localhost:8000/127.0.0.1:8000/g; s/localhost:4000/127.0.0.1:4000/g' /etc/nginx/conf.d/default.conf
                    if ! grep -q 'rewrite \^/orgs/default/' /etc/nginx/conf.d/default.conf; then
                      sed -i '/server_name localhost;/a \    absolute_redirect off;\n    rewrite ^/orgs/default/courses/(course_[a-zA-Z0-9_-]+)/?$ /course/$1 permanent;\n    rewrite ^/courses/(course_[a-zA-Z0-9_-]+)/?$ /course/$1 permanent;\n    rewrite ^/orgs/default/(.*)$ /$1 permanent;' /etc/nginx/conf.d/default.conf
                    fi
                    nginx -s reload || true
                    (
                      for i in $(seq 1 30); do
                        if nc -z 127.0.0.1 9000; then
                          break
                        fi
                        sleep 3
                        if ! nc -z 127.0.0.1 9000; then
                          pm2 restart learnhouse-api || true
                        fi
                      done
                    ) &
                    python3 -c "
                    import os, subprocess
                    try:
                        out = subprocess.check_output(['grep', '-rl', 'ADD_TAGS:[\"iframe\"]', '/app/web/.next']).decode()
                        for fp in out.strip().splitlines():
                            if fp:
                                with open(fp, 'r') as f:
                                    c = f.read()
                                c = c.replace('ADD_TAGS:[\"iframe\"]', 'ADD_TAGS:[\"iframe\",\"audio\",\"source\"]')
                                c = c.replace('\"scrolling\",\"name\"]', '\"scrolling\",\"name\",\"controls\",\"preload\",\"type\"]')
                                with open(fp, 'w') as f:
                                    f.write(c)
                    except Exception:
                        pass
                    "
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and .Values.topologySpread .Values.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpread.maxSkew | default 1 }}
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: {{ .Values.topologySpread.whenUnsatisfiable | default "ScheduleAnyway" }}
          labelSelector:
            matchLabels:
              {{- include "learnhouse.selectorLabels" . | nindent 14 }}
        - maxSkew: {{ .Values.topologySpread.maxSkew | default 1 }}
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: {{ .Values.topologySpread.whenUnsatisfiable | default "ScheduleAnyway" }}
          labelSelector:
            matchLabels:
              {{- include "learnhouse.selectorLabels" . | nindent 14 }}
      {{- else if .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml .Values.topologySpreadConstraints | nindent 8 }}
      {{- end }}
