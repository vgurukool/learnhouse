apiVersion: apps/v1
kind: Deployment
metadata:
  name: learnhouse-redis
  labels:
    app.kubernetes.io/name: learnhouse-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: learnhouse-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: learnhouse-redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
          name: redis
        resources:
          limits:
            cpu: 250m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: learnhouse-redis
  labels:
    app.kubernetes.io/name: learnhouse-redis
spec:
  ports:
  - port: 6379
    targetPort: 6379
    name: redis
  selector:
    app.kubernetes.io/name: learnhouse-redis
