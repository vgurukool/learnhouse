replicaCount: 2

image:
  repository: ayusing/learnhouse
  pullPolicy: Always
  tag: "sso-v1"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
    # eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/learnhouse-irsa
  name: ""

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 80
  collabPort: 4000
  targetCollabPort: 4000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    kubernetes.io/tls-acme: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "learnhouse"
  hosts:
    - host: learnhouse.vgurukool.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: learnhouse-tls
      hosts:
        - learnhouse.vgurukool.com

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 250m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 80

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 45
  periodSeconds: 20
  timeoutSeconds: 10
  failureThreshold: 5

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 25
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 5

env:
  NODE_ENV: "production"
  LEARNHOUSE_OSS: "true"
  NEXT_PUBLIC_LEARNHOUSE_OSS: "true"
  PORT: "8000"
  LEARNHOUSE_PORT: "9000"
  COLLAB_PORT: "4000"
  HOSTNAME: "0.0.0.0"
  LEARNHOUSE_DOMAIN: "learnhouse.vgurukool.com"
  LEARNHOUSE_FRONTEND_DOMAIN: "learnhouse.vgurukool.com"
  LEARNHOUSE_SSL: "true"
  LEARNHOUSE_COOKIE_DOMAIN: ".vgurukool.com"
  NEXTAUTH_URL: "https://learnhouse.vgurukool.com"
  NEXTAUTH_SECRET: "cnoe-vgurukool-nextauth-secret-key-2026-prod"
  LEARNHOUSE_AUTH_JWT_SECRET_KEY: "cnoe-vgurukool-learnhouse-jwt-secret-key-2026-prod"
  COLLAB_INTERNAL_KEY: "cnoe-vgurukool-collab-internal-key-2026-prod"
  LEARNHOUSE_SQL_CONNECTION_STRING: "postgresql://learnhouse:LearnHouse2026SecurePass@learnhouse-db:5432/learnhouse"
  NEXT_PUBLIC_LEARNHOUSE_API_URL: "https://learnhouse.vgurukool.com/api/v1/"
  NEXT_PUBLIC_LEARNHOUSE_BACKEND_URL: "https://learnhouse.vgurukool.com/"
  NEXT_PUBLIC_LEARNHOUSE_DOMAIN: "learnhouse.vgurukool.com"
  NEXT_PUBLIC_LEARNHOUSE_TOP_DOMAIN: "vgurukool.com"
  NEXT_PUBLIC_LEARNHOUSE_DEFAULT_ORG: "default"
  NEXT_PUBLIC_LEARNHOUSE_HTTPS: "True"
  NEXT_PUBLIC_COLLAB_URL: "wss://learnhouse.vgurukool.com/collab"
  LEARNHOUSE_INITIAL_ADMIN_EMAIL: "admin@vgurukool.com"
  LEARNHOUSE_INITIAL_ADMIN_PASSWORD: "-0GZHFZX--Ghhe53q8L-z-M9YEEWSPWD"
  LEARNHOUSE_INITIAL_ORG_NAME: "Vgurukool Academy"
  LEARNHOUSE_INITIAL_ORG_SLUG: "default"
  LEARNHOUSE_CONTENT_DELIVERY_TYPE: "filesystem"
  LEARNHOUSE_REDIS_CONNECTION_STRING: "redis://learnhouse-redis:6379"
  LEARNHOUSE_COOKIE_DOMAIN_ALLOW_BROAD: "true"
  KEYCLOAK_URL: "https://vgurukool.com/keycloak"
  KEYCLOAK_INTERNAL_URL: "http://keycloak.keycloak.svc.cluster.local/keycloak"
  KEYCLOAK_REALM: "cnoe"
  KEYCLOAK_CLIENT_ID: "vgurukool-apps"
  LEARNHOUSE_IS_AI_ENABLED: "true"
  LEARNHOUSE_AI_PROVIDER: "openai"
  LEARNHOUSE_AI_API_KEY: "sk-litellm-vgurukool-master-2026"
  LEARNHOUSE_AI_BASE_URL: "http://litellm.litellm.svc.cluster.local:4000/v1"
  LEARNHOUSE_AI_MODEL_STANDARD: "gemini-2.5-flash"
  LEARNHOUSE_AI_MODEL_FAST: "gemini-2.5-flash"
  LEARNHOUSE_AI_MODEL_PRO: "gemini-2.5-flash"
  LEARNHOUSE_GEMINI_API_KEY: "sk-litellm-vgurukool-master-2026"

nodeSelector: {}
tolerations: []
affinity: {}

# Pod Topology Spread Constraints to distribute pods evenly across nodes and zones
topologySpread:
  enabled: true
  maxSkew: 1
  whenUnsatisfiable: ScheduleAnyway
